[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cryodispatch-sim"
version = "0.1.0"
description = "CryoDispatch telemetry simulator and local plant API"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2",
  "python-dotenv>=1.0",
  "rich>=13",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
mqtt = ["paho-mqtt>=2"]
dev = ["pytest>=8"]

[project.scripts]
cryosim = "sim.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
